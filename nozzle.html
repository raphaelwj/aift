<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Rocket Lab - Nozzle Design Engine</title>
    <style>
        :root { --bg: #ffffff; --text: #000000; --point: #ffcc00; --border: #000000; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
        .home-btn { background: #fff; color: #000; padding: 8px 15px; border: 2px solid var(--border); text-decoration: none; font-weight: bold; transition: 0.2s; }
        .home-btn:hover { background: var(--point); transform: translateY(-2px); box-shadow: 4px 4px 0px #000; }
        .container { display: flex; gap: 30px; }
        .panel { flex: 1; border: 3px solid var(--border); padding: 25px; box-shadow: 8px 8px 0px #000; background: #fff; max-height: 85vh; overflow-y: auto; }
        h2 { border-bottom: 3px solid var(--border); padding-bottom: 5px; margin-top: 0; font-size: 1.4rem; background: var(--point); display: inline-block; padding-right: 20px; }
        label { font-weight: bold; font-size: 0.8rem; color: #444; }
        input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 2px solid var(--border); font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background: #fff; color: #000; border: 3px solid var(--border); padding: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 10px; }
        button:hover { background: var(--point); transform: translateY(-3px); box-shadow: 5px 5px 0px #000; }
        #blueprint-btn { background: var(--point); margin-top: 25px; display: none; }
        #blueprint-btn:hover { background: #000; color: #fff; }
        svg { background: #fff; border: 2px solid var(--border); width: 100%; height: auto; margin-top: 15px; }
        .result-box { margin-top: 20px; padding: 15px; border: 2px solid var(--border); background: #f9f9f9; line-height: 1.6; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="nav-header">
        <h1>[01] NOZZLE ENGINE V2</h1>
        <a href="index.html" class="home-btn">🏠 HOME</a>
    </div>

    <div class="container">
        <div class="panel">
            <h2>DESIGN PARAMETERS</h2>
            <label>TARGET THRUST (N):</label>
            <input type="number" id="targetThrust" value="250">
            <button onclick="autoDesign()">AUTO OPTIMIZATION (PRO)</button>
            <div style="height: 20px; border-left: 2px dashed #000; margin: 10px auto; width: 0;"></div>
            
            <label>INNER DIAMETER (D_in, mm):</label>
            <input type="number" id="innerD">
            <label>THROAT DIAMETER (D_t, mm):</label>
            <input type="number" id="throatD">
            <label>EXIT DIAMETER (D_e, mm):</label>
            <input type="number" id="exitD">
            <label>CONVERGENCE ANGLE (deg):</label>
            <input type="number" id="convAngle" value="45">
            <label>DIVERGENCE ANGLE (deg):</label>
            <input type="number" id="divAngle" value="15">
            <label>SHOULDER LENGTH (mm):</label>
            <input type="number" id="shoulderL" value="40">
            
            <button onclick="manualCalc()">CALCULATE & RENDER</button>
            
            <div id="results" class="result-box" style="display:none;"></div>
            <button id="blueprint-btn" onclick="goToBlueprint()">🎨 GENERATE PRECISION BLUEPRINT</button>
        </div>

        <div class="panel">
            <h2>PHYSICS PREVIEW (DE LAVAL)</h2>
            <div id="svgContainer">
                <svg viewBox="0 0 400 300">
                    <rect width="100%" height="100%" fill="#eee"/>
                    <text x="120" y="150" font-family="Courier" font-size="14">WAITING FOR PARAMETERS...</text>
                </svg>
            </div>
            <div class="result-box" style="background:#fff; border-style:dashed;">
                <b>ENGINEERING NOTES:</b><br>
                - Convergence: 30-45° for subsonic acceleration.<br>
                - Divergence: 12-15° for supersonic expansion.<br>
                - Shoulder: Must be >1.5x D_in for stability.
            </div>
        </div>
    </div>

    <script>
        let currentDesign = {};

        function autoDesign() {
            const T = parseFloat(document.getElementById('targetThrust').value);
            if (!T) return alert("TARGET THRUST REQUIRED.");
            
            const dIn = Math.sqrt(T / 0.08);
            const dT = dIn * 0.38;
            const dE = dIn * 0.85;
            const shoulder = dIn * 1.5;

            document.getElementById('innerD').value = dIn.toFixed(2);
            document.getElementById('throatD').value = dT.toFixed(2);
            document.getElementById('exitD').value = dE.toFixed(2);
            document.getElementById('shoulderL').value = shoulder.toFixed(1);
            
            manualCalc();
        }

        function manualCalc() {
            const dIn = parseFloat(document.getElementById('innerD').value);
            const dT = parseFloat(document.getElementById('throatD').value);
            const dE = parseFloat(document.getElementById('exitD').value);
            const alpha = parseFloat(document.getElementById('convAngle').value);
            const beta = parseFloat(document.getElementById('divAngle').value);
            const sL = parseFloat(document.getElementById('shoulderL').value);

            if (!dIn || !dT || !dE) return alert("BASIC DIMENSIONS REQUIRED.");

            // Calculate lengths based on angles
            const convL = ((dIn - dT) / 2) / Math.tan((alpha / 2) * Math.PI / 180);
            const divL = ((dE - dT) / 2) / Math.tan((beta / 2) * Math.PI / 180);
            const totalL = sL + convL + divL;

            currentDesign = { dIn, dT, dE, alpha, beta, sL, convL, divL, totalL };
            renderNozzle(currentDesign);
        }

        function renderNozzle(d) {
            const res = document.getElementById('results');
            res.style.display = "block";
            res.innerHTML = `
                <b>[PRECISION ANALYSIS]</b><br>
                TOTAL LENGTH: ${d.totalL.toFixed(2)} mm<br>
                CONV. LENGTH: ${d.convL.toFixed(2)} mm<br>
                DIV. LENGTH: ${d.divL.toFixed(2)} mm<br>
                EST. EXPANSION RATIO: ${( (d.dE*d.dE)/(d.dT*d.dT) ).toFixed(2)}
            `;

            const scale = 300 / d.totalL;
            const hScale = 150 / d.dIn;
            
            const x0 = 20, yMid = 150;
            const x1 = x0 + d.sL * scale;
            const x2 = x1 + d.convL * scale;
            const x3 = x2 + d.divL * scale;

            const yIn = (d.dIn/2) * hScale;
            const yT = (d.dT/2) * hScale;
            const yE = (d.dE/2) * hScale;

            const svg = `<svg viewBox="0 0 400 300" style="background:white;">
                <!-- Shoulder (Insertion Part) -->
                <rect x="${x0}" y="${yMid - yIn}" width="${d.sL * scale}" height="${yIn * 2}" fill="none" stroke="black" stroke-width="2.5" stroke-dasharray="5,3"/>
                
                <!-- Main Nozzle Body -->
                <path d="M ${x1},${yMid - yIn} L ${x2},${yMid - yT} L ${x3},${yMid - yE} L ${x3},${yMid + yE} L ${x2},${yMid + yT} L ${x1},${yMid + yIn} Z" 
                      fill="none" stroke="black" stroke-width="3"/>
                
                <!-- Center Line -->
                <line x1="10" y1="${yMid}" x2="390" y2="${yMid}" stroke="black" stroke-dasharray="8,4" stroke-width="1" />
                
                <!-- Dimension Labels -->
                <text x="${x0}" y="${yMid - yIn - 10}" font-size="10">SHOULDER (${d.sL}mm)</text>
                <text x="${x2}" y="${yMid - yT - 10}" font-size="10">THROAT</text>
                <text x="${x3-40}" y="${yMid + yE + 20}" font-size="10">EXIT (${d.dE}mm)</text>
            </svg>`;

            document.getElementById('svgContainer').innerHTML = svg;
            document.getElementById('blueprint-btn').style.display = "block";
            localStorage.setItem('rocketDesign', JSON.stringify(d));
        }

        function goToBlueprint() { location.href = 'blueprint.html'; }
    </script>
</body>
</html>
